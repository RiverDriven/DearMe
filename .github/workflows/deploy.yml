name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 站点是纯静态的：index.html + assets/ + library/（对外只读文案接口），不需要构建。
      - name: Stage static site
        run: |
          set -e
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          cp -R library _site/
          test -f _site/index.html
          test -f _site/assets/dearme-icon-512.png
          test -f _site/library/v1.json
          echo "staged:" && ls -1 _site _site/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
