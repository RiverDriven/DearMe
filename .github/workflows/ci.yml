name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Required files
        run: |
          set -e
          test -f index.html
          test -f assets/dearme-icon-256.png
          test -f assets/dearme-icon-512.png
          echo "index.html + assets ok"

      - name: Every referenced asset exists
        run: |
          set -e
          grep -oE 'assets/[A-Za-z0-9._-]+\.(png|jpg)' index.html | sort -u | while read -r f; do
            if [ ! -f "$f" ]; then echo "missing: $f"; exit 1; fi
            echo "ok: $f"
          done

      - name: Three views present
        run: |
          set -e
          for v in view-home view-features view-story; do
            grep -q "id=\"$v\"" index.html || { echo "missing view: $v"; exit 1; }
          done
          echo "views ok"

      # 文案表是 index.html 的镜像，改了页面忘了同步就红
      - name: Copy table in sync
        run: python3 tools/copy.py verify
